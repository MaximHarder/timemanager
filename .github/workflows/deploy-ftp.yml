name: Deploy to FTP

# Nach Dependabot-Merges deployen wir bewusst (warten auf die Queue), statt zu skippen.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: FTP

    steps:
      # Warte auf Security-Audit / Dependabot-CI / Merge-Queue — nicht skippen bei Dependabot-Merges.
      # Keine gemeinsame Job-Concurrency mit CI (kein dependabot-updates-gate).
      - name: Auf Security Audit und Dependabot warten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TIMEOUT=3600
          INTERVAL=30
          elapsed=0

          echo "Kurz warten, damit parallele Workflows starten können..."
          sleep 20

          wait_open_runs() {
            local workflow="$1"
            local filter_sha="${2:-}"
            local desc="$3"
            while true; do
              local jq_filter
              if [ -n "$filter_sha" ]; then
                jq_filter="[.[] | select(.headSha == \"${filter_sha}\") | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\")] | length"
              else
                jq_filter='[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length'
              fi
              local count
              count=$(gh run list --repo "$REPO" --workflow "$workflow" --limit 20 --json databaseId,status,headSha --jq "$jq_filter")
              if [ "$count" = "0" ]; then
                echo "${desc}: keine offenen Runs"
                break
              fi
              if [ "$elapsed" -ge "$TIMEOUT" ]; then
                echo "Timeout beim Warten auf ${desc}"
                exit 1
              fi
              echo "${desc}: ${count} offene Run(s) — warte ${INTERVAL}s..."
              sleep "$INTERVAL"
              elapsed=$((elapsed + INTERVAL))
            done
          }

          wait_open_runs "security-audit.yml" "$SHA" "Security Audit"
          wait_open_runs "dependabot-ci-automerge.yml" "" "Dependabot CI"
          wait_open_runs "dependabot-queue.yml" "" "Dependabot Merge Queue"
          echo "Alle Gates frei — Deploy fortsetzen"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Generate deployment version
        id: version
        run: |
          VERSION=$(npm pkg get version | tr -d '"')
          BUILD_NUMBER=${{ github.run_number }}
          DEPLOY_VERSION="${VERSION}-build-${BUILD_NUMBER}"
          echo "version=${DEPLOY_VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${DEPLOY_VERSION}"

      - name: Prepare FTP remote dirs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import os
          from ftplib import FTP, error_perm

          ftp = FTP(os.environ["FTP_SERVER"], timeout=60)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])

          def dir_exists(name: str) -> bool:
              try:
                  ftp.cwd(name)
                  ftp.cwd("..")
                  return True
              except error_perm:
                  return False

          if dir_exists("assets"):
              print("assets/ existiert bereits")
          else:
              print("assets/ fehlt — Ordner anlegen und veralteten Sync-State löschen")
              try:
                  ftp.mkd("assets")
                  print("assets/ angelegt")
              except error_perm as err:
                  raise SystemExit(f"assets/ konnte nicht angelegt werden: {err}") from err
              try:
                  ftp.delete(".ftp-deploy-sync-state.json")
                  print(".ftp-deploy-sync-state.json gelöscht")
              except error_perm as err:
                  print(f"Sync-State nicht entfernt (ok falls nicht vorhanden): {err}")

          ftp.quit()
          PY

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.well-known/**

      - name: Deployment success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHANNEL }}
          token: ${{ secrets.TG_BOT }}
          format: markdown
          message: |
            ✅ *Deployment ${{ steps.version.outputs.version }} erfolgreich - time.maharder.de*

            Das Deployment ${{ steps.version.outputs.version }} auf time.maharder.de war **erfolgreich**!

            📅 **Datum**: ${{ github.event.head_commit.timestamp }}
            🔄 **Commit**: `${{ github.sha }}`
            📝 **Nachricht**: ${{ github.event.head_commit.message }}
            👤 **Autor**: [${{ github.event.head_commit.author.name }}](https://github.com/${{ github.event.head_commit.author.username }})

            Alle Dateien wurden erfolgreich auf den FTP-Server hochgeladen.

            🚀 [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      - name: Deployment failed
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHANNEL }}
          token: ${{ secrets.TG_BOT }}
          format: markdown
          message: |
            ❌ *Deployment fehlgeschlagen - time.maharder.de*

            Das Deployment auf time.maharder.de #${{ github.run_number }} ist **fehlgeschlagen**!

            📅 **Datum**: ${{ github.event.head_commit.timestamp }}
            🔄 **Commit**: `${{ github.sha }}`
            📝 **Nachricht**: ${{ github.event.head_commit.message }}
            👤 **Autor**: [${{ github.event.head_commit.author.name }}](https://github.com/${{ github.event.head_commit.author.username }})

            Bitte überprüfe die GitHub Actions Logs für weitere Details.

            🔍 [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true
