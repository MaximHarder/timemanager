name: CI and Dependabot Automerge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

# Gemeinsame Gruppe mit deploy-ftp: Deploy wartet, solange CI/Dependabot laufen
concurrency:
  group: dependabot-updates-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        # package-lock.json ist gitignored; npm ci braucht eine committed Lockfile
        run: npm install

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

      - name: Build
        run: npm run build

  automerge:
    name: Dependabot Automerge
    runs-on: ubuntu-latest
    needs: ci
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
